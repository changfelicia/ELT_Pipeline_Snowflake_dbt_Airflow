version: 2

sources: 
  - name: tpch
    database: snowflake_sample_data
    schema: tpch_sf1
    tables: 
      - name: orders
        columns: 
          - name: o_orderkey ## Listing just a column like o_orderkey in the YAML, 
                             ## you aren't "selecting" it you are attaching metadata to it.
            tests: 
              - unique       
              - not_null     ## I want you to specifically watch this one 
                             ## to make sure it's never empty or duplicated.
      - name: lineitem
        columns: 
          - name: l_orderkey
            tests: 
              - relationships: 
                    to: source('tpch', 'orders')
                    field: o_orderkey
